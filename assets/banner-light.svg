  <text x="54" y="119" fill="#14243a" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" letter-spacing="-1.2">Sofia Monteiro</text>
  <text x="56" y="151" fill="url(#accent)" font-family="monospace" font-size="17" font-weight="600">Computer Engineering · UFGD</text>
  <text x="56" y="181" fill="#52677f" font-family="monospace" font-size="13">Software Development  /  Robotics  /  Artificial Intelligence</text>

  <!-- Compact project/interest panel -->
