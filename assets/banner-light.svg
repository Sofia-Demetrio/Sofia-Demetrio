  <circle cx="47" cy="39" r="4" fill="#fb7185"/>
  <circle cx="62" cy="39" r="4" fill="#fbbf24"/>
  <circle cx="77" cy="39" r="4" fill="#34d399"/>
  <text x="500" y="43" text-anchor="middle" fill="#52677f" font-family="monospace" font-size="11" letter-spacing="1.3">sofiamonteirodemetriodev@gmail.com | computer engineering</text>
  <text x="945" y="43" text-anchor="end" fill="#087eae" font-family="monospace" font-size="10">PROFILE.README</text>

