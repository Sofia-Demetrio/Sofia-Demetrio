    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d7e5f2" stroke-width="0.7" opacity=".55"/>
      <circle cx="1" cy="1" r="1" fill="#d7e5f2"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#background)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#c6d7e8" stroke-width="1.5"/>

  <!-- Decorative circuit traces -->
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".55">
    <path d="M730 0V42H790V70H850"/>
    <path d="M1000 105H930V132H890"/>
    <path d="M760 300V260H820V236H900"/>
    <path d="M0 226H54V202H105"/>
  </g>
  <g fill="#087eae">
